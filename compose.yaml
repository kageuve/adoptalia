# Production. Development uses compose.dev.yaml instead.
name: ${COMPOSE_PROJECT_NAME:-adoptalia}
x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"
x-security: &security
  security_opt: ["no-new-privileges:true"]
  logging: *logging
services:
  db:
    image: ${MYSQL_IMAGE:-mysql:8.0.45@sha256:a3dff78d876222746a0bacc36dd7e4bf9e673c85fb7ee0d12ed25bd32c43c19b}
    restart: unless-stopped
    logging: *logging
    environment:
      MYSQL_INITDB_SKIP_TZINFO: "1"
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-adoptalia_db}
      MYSQL_USER: ${MYSQL_USER:-adoptalia_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - ${DB_DATA_DIR:-./db/mysql}:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h127.0.0.1 -u"$$MYSQL_USER" "$$MYSQL_DATABASE" -Nse 'SELECT id FROM usuario LIMIT 0' >/dev/null
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s
    networks: [database]
  backend:
    <<: *security
    image: ${APP_IMAGE_PREFIX:-adoptalia}/backend:${APP_VERSION:-local}
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    tmpfs: ["/tmp:size=32m,mode=1777"]
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_USER: ${MYSQL_USER:-adoptalia_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE:-adoptalia_db}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (at least 32 characters)}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-loopback,linklocal,uniquelocal}
    volumes:
      - ${UPLOADS_DATA_DIR:-./data/uploads}:/app/public/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
    networks: [web, database]
  frontend:
    <<: *security
    image: ${APP_IMAGE_PREFIX:-adoptalia}/frontend:${APP_VERSION:-local}
    build:
      context: ./frontend
    restart: unless-stopped
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    tmpfs: ["/tmp:size=32m,uid=101,gid=101,mode=1777", "/var/cache/nginx:size=32m,uid=101,gid=101"]
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-80}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      backend:
        condition: service_healthy
    networks: [web]
  phpmyadmin:
    <<: *security
    image: ${PHPMYADMIN_IMAGE:-phpmyadmin/phpmyadmin:5.2.3@sha256:42a200db07b4e70fbf32c594ad4521cf16399b8e54bbb5adceae98e7566dfbeb}
    restart: unless-stopped
    ports:
      - "${PMA_BIND_ADDRESS:-127.0.0.1}:${PMA_PORT:-8080}:80"
    environment:
      PMA_HOST: db
      PMA_ARBITRARY: 0
      UPLOAD_LIMIT: 32M
    depends_on:
      db:
        condition: service_healthy
    networks: [database, admin]
networks:
  web:
  database:
    internal: true
  admin:
