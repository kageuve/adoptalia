server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 6M;
    client_body_timeout 15s;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

    # Resolve Docker service again when backend is recreated (no nginx rebuild).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:3000;
    location = /healthz { access_log off; return 200 'ok'; }
    location /api/ {
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Overwrite, do not trust headers supplied by clients.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location /uploads/ {
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
    }
    location ~ /\. { deny all; }
    location ~* \.(?:js|css|woff2?)$ {
        try_files $uri =404;
        expires 1h;
    }
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
